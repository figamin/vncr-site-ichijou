# Native Redis for the lean core.
# Install as /etc/redis/vnclub.conf and add
#   include /etc/redis/vnclub.conf
# at the end of /etc/redis/redis.conf.

bind 127.0.0.1
protected-mode yes
port 6379

# Set the same password used in REDIS_URL.
requirepass CHANGE_ME

maxmemory 128mb
maxmemory-policy allkeys-lru

appendonly yes
appendfsync everysec
dir /var/lib/redis

supervised systemd
