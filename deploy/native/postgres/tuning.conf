# Native PostgreSQL tuning for a 2-4 GiB host.
# Install as /etc/postgresql/15/main/conf.d/vnclub.conf.

listen_addresses = '127.0.0.1'

# Sized for the lean core, not the import worker.
shared_buffers = 256MB
work_mem = 8MB
maintenance_work_mem = 128MB
effective_cache_size = 1GB

# API (10+10), optional bot (10+10), and the remote worker (5+5) fit with
# headroom for migrations and admin sessions.
max_connections = 80

wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 256MB

random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200

bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

log_min_duration_statement = 500
idle_in_transaction_session_timeout = 2min
