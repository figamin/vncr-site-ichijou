# Native PostgreSQL tuning for a single host (6-8 GiB RAM minimum).
#
# Install as /etc/postgresql/15/main/conf.d/vnclub.conf when the API, Redis, the
# web front end and the heavy import all share one machine:
#
#   sudo install -m 644 deploy/native/postgres/tuning-single-host.conf \
#     /etc/postgresql/15/main/conf.d/vnclub.conf
#
# For a small two-host core (2-4 GiB) use tuning.conf instead. Raise
# shared_buffers only up to about 25% of RAM, and remember the heavy import and
# the Next build also need memory on this host.

listen_addresses = '127.0.0.1'

# ~12% of an 8 GiB host. On a 6 GiB host, 768MB is the safer figure.
shared_buffers = 1GB
work_mem = 16MB
maintenance_work_mem = 512MB
effective_cache_size = 3GB

# API pool (5+10), bot pool (5+10), heavy job pool (5+10) and admin sessions.
# PostgreSQL reserves some per-connection memory, so keep this modest.
max_connections = 80

wal_buffers = 16MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
max_wal_size = 4GB
min_wal_size = 512MB

# SSD / NVMe / eMMC storage, which is what an arm64 host usually has.
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200

bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

log_min_duration_statement = 500
idle_in_transaction_session_timeout = 2min
