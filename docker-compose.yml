services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_VNDB_STATS_API=${NEXT_PUBLIC_VNDB_STATS_API}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports:
      # Host Angie reaches the container on loopback.
      - "127.0.0.1:3000:3000"
    group_add:
      # Host image directory is owned by 1000:1000; nextjs is 1001.
      - "1000"
    environment:
      - NODE_ENV=production
      - VNDB_CACHE_DIR=/app/public/vndb-images
    volumes:
      # Site-owned image directory, also served by host Angie.
      - ./public/vndb-images:/app/public/vndb-images
    restart: unless-stopped
    # Resource limits for DoS protection
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
