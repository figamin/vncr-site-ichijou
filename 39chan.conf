# VN Club — https://vnclub.figamin.net
#
# The Next.js production server listens on 127.0.0.1:3000. Browser calls to
# /api/backend/* are proxied by Next to the stats backend, so Angie only needs
# this one upstream. No Anubis, no old 39chan paths.

# Maps ?w= to the resized filename suffix used by the site image directory.
map $arg_w $vnclub_img_width_suffix {
    "20"    "-w20";
    "128"   "-w128";
    "256"   "-w256";
    "512"   "-w512";
    default "";
}

upstream vnclub_app {
    server 127.0.0.1:3000;
    zone vnclub_app_zone 64k;
    keepalive 32;
}

server {
    listen 80;
    server_name vnclub.figamin.net;
    server_tokens off;
    return 301 https://vnclub.figamin.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name vnclub.figamin.net;
    client_max_body_size 20m;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/vnclub.figamin.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vnclub.figamin.net/privkey.pem;

    # Next is built with compress:false (see next.config.mjs), so Angie must
    # compress proxied responses. gzip_proxied any is required: nginx does not
    # compress upstream responses by default.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # ssl_buffer_size, ssl_certificate_compression, tcp_nopush and gzip_static
    # are set once in angie.conf and apply to every vhost.

    status_zone vnclub;

    # --- HTTP/3 ---
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # --- Per-vhost access log (buffered, low IO cost) ---
    access_log /var/log/angie/vnclub_access.log combined buffer=32k flush=5s;

    # --- VNDB images (served directly from the site's public/vndb-images) ---
    # /srv/vnclub/vndb-images is a bind mount of <project>/public/vndb-images.
    # The app writes there via VNDB_CACHE_DIR; Angie reads the same files, so
    # there is no separate /var/cache copy.
    #
    # IMPORTANT: this bypasses the per-VN blacklist check in the Next image
    # route. If blacklisted covers must stay hidden, either remove them from
    # the directory after blacklisting or keep ?vn= requests proxied to Next.
    location ~ ^/img/((?:cv|ch|sf)/\d\d/\d+)\.(jpg|webp)$ {
        status_zone location_vnclub_images;

        # Alternative if you prefer to expose the project path directly:
        # alias /home/figamin/vn-club-resources/public/vndb-images/$1$vnclub_img_width_suffix.webp;
        alias /srv/vnclub/vndb-images/$1$vnclub_img_width_suffix.webp;
        types { }
        default_type image/webp;

        sendfile on;
        tcp_nopush on;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Served-By "angie-static" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Missing file or not-yet-generated width variant → let Next create it.
        error_page 404 = @vnclub_app;
        log_not_found off;
    }

    location @vnclub_app {
        proxy_pass http://vnclub_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    location / {
        status_zone location_vnclub_app;

        proxy_pass http://vnclub_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-Host  $host;

        # Next sends relative redirects; keep them relative to this vhost.
        proxy_redirect off;

        # Recommendation/stats endpoints can outlast nginx's 60s default.
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
